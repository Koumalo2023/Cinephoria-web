name: Test OIDC Connection - Frontend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  AWS_REGION: 'eu-west-3'

jobs:
  test-oidc-auth:
    name: Test OIDC Authentication
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        role-session-name: GitHubActions-OIDC-Test-Frontend

    - name: Test S3 permissions
      run: |
        echo "🔍 Testing S3 permissions..."
        # Test list buckets (basic permission)
        aws s3 ls --region ${{ env.AWS_REGION }} || echo "⚠️  Cannot list all buckets (expected if restricted to specific buckets)"
        
        # Test specific bucket access if available
        if [ -n "${{ secrets.S3_BUCKET }}" ]; then
          echo "Testing access to bucket: ${{ secrets.S3_BUCKET }}"
          aws s3 ls s3://${{ secrets.S3_BUCKET }}/ --region ${{ env.AWS_REGION }} || echo "ℹ️  Bucket might be empty or not exist yet"
        fi
        
        echo "✅ S3 permissions test passed"

    - name: Test IAM role identity
      run: |
        echo "🔍 Testing IAM role identity..."
        aws sts get-caller-identity
        echo "✅ IAM identity test passed"

    - name: Verify environment variables
      run: |
        echo "🔍 Verifying environment configuration..."
        echo "Environment: ${{ github.event.inputs.environment }}"
        echo "AWS Region: ${{ env.AWS_REGION }}"
        echo "S3 Bucket: ${{ secrets.S3_BUCKET }}"
        echo "✅ Environment verification complete"

  test-deployment-readiness:
    name: Test Deployment Readiness
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    needs: test-oidc-auth

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        role-session-name: GitHubActions-OIDC-Test-Frontend-Deployment
    - name: List Cinephoria-web directory contents
      run: ls -la Cinephoria-web/

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: package-lock.json
      working-directory: Cinephoria-web

    - name: Install dependencies
      working-directory: Cinephoria-web
      run: npm ci

    - name: Test Angular build configuration
      working-directory: Cinephoria-web
      run: |
        echo "🔍 Testing Angular build configuration..."
        ENVIRONMENT=${{ github.event.inputs.environment }}
        
        if [ "$ENVIRONMENT" = "staging" ]; then
          BUILD_COMMAND="build:staging"
          API_URL="https://staging-api.cinephoria.eu/api"
        else
          BUILD_COMMAND="build:prod" 
          API_URL="https://api.cinephoria.eu/api"
        fi
        
        echo "Build command: $BUILD_COMMAND"
        echo "API URL: $API_URL"
        
        # Test if build command exists in package.json
        if npm run | grep -q "$BUILD_COMMAND"; then
          echo "✅ Build command '$BUILD_COMMAND' exists"
        else
          echo "❌ Build command '$BUILD_COMMAND' not found in package.json"
          exit 1
        fi
        
        echo "✅ Angular build configuration test passed"

    - name: Test S3 deployment simulation
      run: |
        echo "🔍 Testing S3 deployment simulation..."
        ENVIRONMENT=${{ github.event.inputs.environment }}
        S3_BUCKET=${{ secrets.S3_BUCKET }}
        
        if [ -n "$S3_BUCKET" ]; then
          echo "Simulating deployment to: s3://$S3_BUCKET/"
          echo "Would sync dist/ folder with cache control settings"
          echo "✅ S3 deployment simulation passed"
        else
          echo "⚠️  S3_BUCKET secret not set - please configure in GitHub Environments"
        fi

    - name: Final validation
      run: |
        echo "🎉 OIDC Connection Test COMPLETED SUCCESSFULLY!"
        echo "✅ OIDC Authentication working"
        echo "✅ AWS S3 Permissions validated"
        echo "✅ Angular build configuration ready"
        echo "✅ Environment: ${{ github.event.inputs.environment }}"
        echo ""
        echo "Next steps:"
        echo "- Add S3_BUCKET secret to GitHub Environments"
        echo "- Implement full deployment workflow"
        echo "- Test actual S3 deployment"

# Workflow version 1.0
