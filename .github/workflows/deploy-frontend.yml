name: Deploy Frontend to AWS

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: 'eu-west-3'

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production') || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production') || 'staging' }}
    
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Determine environment and settings
      id: config
      run: |
        if [[ "${{ github.event.inputs.environment }}" != "" ]]; then
          ENV="${{ github.event.inputs.environment }}"
        elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          ENV="production"
        else
          ENV="staging"
        fi
        echo "ENV=$ENV" >> $GITHUB_ENV
        if [[ "$ENV" == "production" ]]; then
          echo "S3_BUCKET=cinephoria-frontend-prod" >> $GITHUB_ENV
          echo "CLOUDFRONT_DISTRIBUTION=E15H3W5INPEFQV" >> $GITHUB_ENV
          echo "AWS_ROLE_ARN=arn:aws:iam::852396292650:role/github-actions-cinephoria-frontend" >> $GITHUB_ENV
        else
          echo "S3_BUCKET=cinephoria-frontend-staging" >> $GITHUB_ENV
          echo "CLOUDFRONT_DISTRIBUTION=E2T791VAVLYF1G" >> $GITHUB_ENV
          echo "AWS_ROLE_ARN=arn:aws:iam::852396292650:role/github-actions-cinephoria-frontend" >> $GITHUB_ENV
        fi

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
        role-session-name: GitHubActions-Frontend-Deploy-${{ env.ENV }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Build Angular application
      run: |
        if [[ "$ENV" == "production" ]]; then
          npm run build:prod
        else
          npm run build:staging
        fi

    - name: Deploy to S3
      run: |
        echo "Deploying to S3 bucket: $S3_BUCKET"
        aws s3 sync dist/cinephoria-web/ s3://$S3_BUCKET/ \
          --delete \
          --cache-control "public, max-age=31536000" \
          --exclude "*.html" \
          --exclude "*.json" \
          --exclude "*.xml"
        aws s3 sync dist/cinephoria-web/ s3://$S3_BUCKET/ \
          --delete \
          --cache-control "public, max-age=0, must-revalidate" \
          --include "*.html" \
          --include "*.json" \
          --include "*.xml"
        echo "Deployment to S3 completed."

    - name: Invalidate CloudFront cache
      run: |
        echo "Invalidating CloudFront distribution: $CLOUDFRONT_DISTRIBUTION"
        aws cloudfront create-invalidation \
          --distribution-id $CLOUDFRONT_DISTRIBUTION \
          --paths "/*"

    - name: Output deployment URLs
      run: |
        echo "🎉 Frontend deployed successfully!"
        echo "Environment: $ENV"
        echo "S3 Bucket: $S3_BUCKET"
        if [[ "$ENV" == "production" ]]; then
          echo "Production URL: https://www.cinephoria.eu"
          echo "CloudFront URL: https://d3rn2n502s1gxw.cloudfront.net"
        else
          echo "Staging URL: https://staging-app.cinephoria.eu"
          echo "CloudFront URL: https://d16ke9pud0luuc.cloudfront.net"
        fi