name: Frontend CI/CD

on:
  push:
    branches:
      - develop    # Déploiement auto staging
      - staging    # Déploiement manuel après validation
      - production # Déploiement auto production

jobs:
  # Tests obligatoires sur toutes les branches
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Run unit tests
        run: npm run test:ci
      
      - name: Security audit
        run: npm audit --audit-level moderate
      
      - name: Lint code
        run: npm run lint

  # Build conditionnel par environnement
  build:
    name: Build for ${{ github.ref_name }}
    runs-on: ubuntu-latest
    needs: test
    if: success()
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Build application
        run: |
          if [[ "${{ github.ref_name }}" == "production" ]]; then
            npm run build:prod
          else
            npm run build:staging
          fi

  # Déploiement automatique selon la branche
  deploy:
    name: Deploy to ${{ github.ref_name }}
    runs-on: ubuntu-latest
    needs: build
    if: success()
    environment: ${{ github.ref_name }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-3
      
      - name: Deploy to S3
        run: |
          if [[ "${{ github.ref_name }}" == "production" ]]; then
            BUCKET="cinephoria-frontend-prod"
          else
            BUCKET="cinephoria-frontend-staging"
          fi
          
          aws s3 sync dist/ s3://$BUCKET/ --delete
          
      - name: Invalidate CloudFront
        run: |
          if [[ "${{ github.ref_name }}" == "production" ]]; then
            DISTRIBUTION="E15H3W5INPEFQV"
          else
            DISTRIBUTION="E2T791VAVLYF1G"
          fi
          
          aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION \
            --paths "/*"