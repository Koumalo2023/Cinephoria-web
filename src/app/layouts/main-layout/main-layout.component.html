<div class="main-layout">
  <!-- Header principal avec navigation utilisateur -->
  <app-header
    [variant]="headerConfig.variant"
    [showLogo]="headerConfig.showLogo"
    [showNavigation]="headerConfig.showNavigation"
    [showUserMenu]="headerConfig.showUserMenu">
  </app-header>

  <!-- Contenu principal de l'application -->
  <main class="main-content">
    <!-- Contenu dynamique des routes -->
    <section class="dynamic-content">
      <div class="container">
        <router-outlet></router-outlet>
      </div>
    </section>
  </main>

  <!-- Footer principal -->
  <app-footer
    [variant]="footerConfig.variant"
    [showCinemaInfo]="footerConfig.showCinemaInfo"
    [showSocialLinks]="footerConfig.showSocialLinks"
    [showLegalLinks]="footerConfig.showLegalLinks">
  </app-footer>
  <!-- Notifications toast -->
  <app-toast-notification></app-toast-notification>
</div>
