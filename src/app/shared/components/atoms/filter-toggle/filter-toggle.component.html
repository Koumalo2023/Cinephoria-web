<div
  [class]="wrapperClasses"
  role="checkbox"
  [attr.aria-checked]="checked"
  [attr.aria-disabled]="disabled"
  [attr.aria-label]="label"
  tabindex="0"
  (click)="onToggle()"
  (keydown)="onKeyDown($event)"
>
  <!-- Icône optionnelle -->
  <div *ngIf="icon" class="filter-toggle__icon">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
      <path d="M1.5 1.5A.5.5 0 0 1 2 1h12a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.128.334L10 8.692V13.5a.5.5 0 0 1-.342.474l-3 1A.5.5 0 0 1 6 14.5V8.692L1.628 3.834A.5.5 0 0 1 1.5 3.5v-2z"/>
    </svg>
  </div>

  <!-- Label -->
  <span class="filter-toggle__label">{{ label }}</span>

  <!-- Compteur optionnel -->
  <div *ngIf="showCount && count > 0" class="filter-toggle__count">
    {{ count }}
  </div>

  <!-- Indicateur visuel du toggle -->
  <div class="filter-toggle__indicator">
    <div class="filter-toggle__indicator-dot"></div>
  </div>
</div>
