<div [class]="containerClasses">
  <!-- Label -->
  <label *ngIf="label" class="form-field__label">
    {{ label }}
    <span *ngIf="required" class="form-field__required" aria-hidden="true">*</span>
  </label>

  <!-- Conteneur du contrôle avec préfixe/suffixe -->
  <div [class]="controlWrapperClasses">
    <!-- Préfixe -->
    <div *ngIf="prefixTemplate" class="form-field__prefix">
      <ng-container *ngIf="prefixTemplate" [ngTemplateOutlet]="prefixTemplate"></ng-container>
    </div>

    <!-- Contrôle principal -->
    <div class="form-field__control">
      <ng-container *ngIf="controlTemplate" [ngTemplateOutlet]="controlTemplate"></ng-container>
    </div>

    <!-- Suffixe -->
    <div *ngIf="suffixTemplate" class="form-field__suffix">
      <ng-container *ngIf="suffixTemplate" [ngTemplateOutlet]="suffixTemplate"></ng-container>
    </div>
  </div>

  <!-- Messages (erreur, succès, aide) -->
  <div *ngIf="hasMessage" class="form-field__message" [class]="'form-field__message--' + messageType">
    <!-- Icône du message -->
    <div class="form-field__message-icon">
      <svg *ngIf="messageType === 'error'" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
        <path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0zM7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 4.995z"/>
      </svg>
      
      <svg *ngIf="messageType === 'success'" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
      </svg>
      
      <svg *ngIf="messageType === 'hint'" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
        <path d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533L8.93 6.588zM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0z"/>
      </svg>
    </div>

    <!-- Texte du message -->
    <span class="form-field__message-text">{{ message }}</span>
  </div>

  <!-- Compteur de caractères (optionnel) -->
  <div *ngIf="false" class="form-field__counter">
    <!-- À implémenter si nécessaire -->
  </div>
</div>
