<form
  [class]="containerClasses"
  [formGroup]="passwordResetForm"
  (ngSubmit)="onSubmit()"
  novalidate
>
  <div [class]="formClasses">
    <!-- Champ email (optionnel) -->
    <div
      *ngIf="showEmail"
      [class]="getFieldClasses('email')"
      class="password-reset-form__field"
    >
      <app-form-field
        [label]="emailLabel"
        [required]="true"
        [errorMessage]="getErrorMessage('email')"
        [hasError]="hasError('email')"
        [isValid]="isValid('email')"
      >
        <app-input
          type="email"
          formControlName="email"
          [placeholder]="'exemple@email.com'"
          [disabled]="loading || disabled"
        ></app-input>
      </app-form-field>
    </div>

    <!-- Champ mot de passe actuel (optionnel) -->
    <div
      *ngIf="showCurrentPassword"
      [class]="getFieldClasses('currentPassword')"
      class="password-reset-form__field"
    >
      <app-form-field
        [label]="currentPasswordLabel"
        [required]="true"
        [errorMessage]="getErrorMessage('currentPassword')"
        [hasError]="hasError('currentPassword')"
        [isValid]="isValid('currentPassword')"
      >
        <app-password-input
          formControlName="currentPassword"
          [placeholder]="'Entrez votre mot de passe actuel'"
          [disabled]="loading || disabled"
        ></app-password-input>
      </app-form-field>
    </div>

    <!-- Champ token (optionnel) -->
    <div
      *ngIf="showToken"
      [class]="getFieldClasses('token')"
      class="password-reset-form__field"
    >
      <app-form-field
        [label]="tokenLabel"
        [required]="true"
        [errorMessage]="getErrorMessage('token')"
        [hasError]="hasError('token')"
        [isValid]="isValid('token')"
      >
        <app-input
          type="text"
          formControlName="token"
          [placeholder]="'Entrez le code de réinitialisation'"
          [disabled]="loading || disabled"
        ></app-input>
      </app-form-field>
    </div>

    <!-- Champ nouveau mot de passe -->
    <div
      [class]="getFieldClasses('newPassword')"
      class="password-reset-form__field"
    >
      <app-form-field
        [label]="newPasswordLabel"
        [required]="true"
        [errorMessage]="getErrorMessage('newPassword')"
        [hasError]="hasError('newPassword')"
        [isValid]="isValid('newPassword')"
      >
        <app-password-input
          formControlName="newPassword"
          [placeholder]="'Entrez votre nouveau mot de passe'"
          [disabled]="loading || disabled"
          (focus)="showPasswordRequirements = true"
        ></app-password-input>
      </app-form-field>

      <!-- Indicateur de force du mot de passe -->
      <div
        *ngIf="passwordResetForm.get('newPassword')?.value && passwordResetForm.get('newPassword')?.dirty"
        class="password-reset-form__strength"
      >
        <div class="password-reset-form__strength-bar">
          <div
            class="password-reset-form__strength-fill"
            [class]="passwordStrengthClass"
            [style.width.%]="passwordStrength"
          ></div>
        </div>
        <span class="password-reset-form__strength-text">
          Force : {{ passwordStrengthText }}
        </span>
      </div>

      <!-- Exigences du mot de passe -->
      <div
        *ngIf="showPasswordRequirements"
        [class]="requirementsClasses"
      >
        <h5 class="password-reset-form__requirements-title">
          Exigences du mot de passe
        </h5>
        <ul class="password-reset-form__requirements-list">
          <li
            *ngFor="let requirement of passwordRequirements"
            class="password-reset-form__requirement"
            [class.password-reset-form__requirement--met]="isRequirementMet(requirement)"
          >
            <app-icon
              [name]="isRequirementMet(requirement) ? 'check-circle' : 'x-circle'"
              [size]="'xs'"
              [variant]="isRequirementMet(requirement) ? 'success' : 'error'"
            ></app-icon>
            {{ requirement }}
          </li>
        </ul>
      </div>
    </div>

    <!-- Champ confirmation du mot de passe -->
    <div
      [class]="getFieldClasses('confirmPassword')"
      class="password-reset-form__field"
    >
      <app-form-field
        [label]="confirmPasswordLabel"
        [required]="true"
        [errorMessage]="getErrorMessage('confirmPassword')"
        [hasError]="hasError('confirmPassword')"
        [isValid]="isValid('confirmPassword')"
      >
        <app-password-input
          formControlName="confirmPassword"
          [placeholder]="'Confirmez votre nouveau mot de passe'"
          [disabled]="loading || disabled"
        ></app-password-input>
      </app-form-field>

      <!-- Indicateur de correspondance des mots de passe -->
      <div
        *ngIf="passwordResetForm.get('confirmPassword')?.dirty"
        class="password-reset-form__match-indicator"
      >
        <div
          *ngIf="passwordsMatch"
          class="password-reset-form__match password-reset-form__match--success"
        >
          <app-icon name="check-circle" size="xs" variant="success"></app-icon>
          Les mots de passe correspondent
        </div>
        <div
          *ngIf="passwordsMismatch"
          class="password-reset-form__match password-reset-form__match--error"
        >
          <app-icon name="x-circle" size="xs" variant="error"></app-icon>
          Les mots de passe ne correspondent pas
        </div>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div [class]="actionsClasses">
    <app-button
      type="submit"
      variant="primary"
      [size]="size"
      [loading]="loading"
      [disabled]="!isFormValid"
    >
      {{ submitLabel }}
    </app-button>

    <app-button
      type="button"
      variant="secondary"
      [size]="size"
      [disabled]="loading || disabled"
      (click)="onCancel()"
    >
      {{ cancelLabel }}
    </app-button>
  </div>
</form>
